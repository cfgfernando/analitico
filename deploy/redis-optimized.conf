# ============================================================
# Redis — Otimização para VPS 4GB
# Backup: sudo cp /etc/redis/redis.conf /etc/redis/redis.conf.bak
# ============================================================

# Limite de memória
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistência (RDB básico — 1 snapshot a cada 15 min se houver mudanças)
save 900 1
save 300 10
save 60 10000

# AOF (Append-Only File) — desativado para economizar I/O
appendonly no

# Performance
tcp-backlog 511
tcp-keepalive 300
timeout 0

# Bind (apenas localhost)
bind 127.0.0.1 ::1

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log
