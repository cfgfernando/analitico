# ============================================================
# Nginx — Proxy Reverso + SPA React + API NestJS
# VPS 4GB DigitalOcean
# Backup: sudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak
# ============================================================

server {
    listen 80;
    server_name analitico.escrita.online;

    # --- Segurança básica ---
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Limites de upload (planilhas XML/CSV até 50MB) ---
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # --- Frontend React (SPA) ---
    root /var/www/analitico/dist;
    index index.html;

    # Cache agressivo para assets com hash (JS/CSS do Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fontes e imagens
    location ~* \.(woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SPA fallback — qualquer rota não encontrada retorna index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API NestJS ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para sync de APIs governamentais (podem ser lentas)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Não bufferizar respostas streamings
        proxy_buffering off;
    }

    # --- Health check ---
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Bloquear acesso a arquivos sensíveis ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
